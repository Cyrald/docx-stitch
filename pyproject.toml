[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docx-stitch"
dynamic = ["version"]
description = "Склейка произвольного числа документов .docx в один за один проход с сохранением стилей, нумерации, сносок, колонтитулов и изображений"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cyrald" }]
requires-python = ">=3.10"
dependencies = ["lxml>=4.9.0"]
keywords = [
    "docx", "word", "ooxml", "merge", "concatenate", "compose", "stitch",
    "title page", "document", "office",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Russian",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup :: XML",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["build", "twine", "ruff"]

[project.scripts]
docx-stitch = "docx_stitch.cli:main"

[project.urls]
Homepage = "https://github.com/Cyrald/docx-stitch"
Source = "https://github.com/Cyrald/docx-stitch"
Issues = "https://github.com/Cyrald/docx-stitch/issues"

[tool.setuptools.dynamic]
version = { attr = "docx_stitch._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docx_stitch = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py310"
